name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install poetry
        run: pipx install poetry
      - name: Install dependencies (without the ML stack)
        run: poetry install --without ml --no-root
      - name: Lint
        run: poetry run ruff check app tests scripts
      - name: Test
        run: poetry run pytest -q
